<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee House — Menu</title>
    <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/themes.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner container">
        <a class="header__logo" href="index.html">
          <img
            class="header__logo-img"
            src="assets/icons/logo.svg"
            alt="Resource Coffee House"
            width="100"
            height="60"
          />
        </a>
        <nav class="header__nav" aria-label="Main">
          <ul class="header__list">
            <li class="header__item">
              <a class="header__link" href="index.html#favorite-coffee">Favorite coffee</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="index.html#about">About</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="index.html#extra">Mobile app</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="#contact">Contact us</a>
            </li>
          </ul>
        </nav>
        <div class="header__actions">
          <a class="header__menu" href="menu.html" aria-current="page">Menu</a>
          <button class="header__theme" type="button" aria-label="Theme">
            <img
              class="header__theme-icon header__theme-icon--light"
              src="assets/icons/light.svg"
              alt=""
              width="36"
              height="36"
            />
            <img
              class="header__theme-icon header__theme-icon--dark"
              src="assets/icons/dark.svg"
              alt=""
              width="36"
              height="36"
            />
          </button>
          <button
            class="header__burger"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-disabled="true"
          >
            <span class="header__burger-bar" aria-hidden="true"></span>
            <span class="header__burger-bar" aria-hidden="true"></span>
            <span class="header__burger-bar" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>
    <main class="main">
      <section class="catalog" id="catalog" aria-labelledby="catalog-title">
        <div class="catalog__inner container">
          <h1 class="catalog__title" id="catalog-title">Menu</h1>
          <div
            class="catalog__tabs"
            role="group"
            aria-label="Menu categories"
          >
            <button
              class="catalog__tab catalog__tab--active"
              type="button"
              data-category="coffee"
              aria-pressed="true"
            >
              Coffee
            </button>
            <button
              class="catalog__tab"
              type="button"
              data-category="tea"
              aria-pressed="false"
              aria-disabled="true"
            >
              Tea
            </button>
            <button
              class="catalog__tab"
              type="button"
              data-category="dessert"
              aria-pressed="false"
              aria-disabled="true"
            >
              Dessert
            </button>
          </div>
          <ul class="catalog__list"></ul>
          <button
            class="catalog__more"
            type="button"
            aria-label="Show more"
            aria-disabled="true"
          >
            Show more
          </button>
        </div>
      </section>
    </main>
    <footer class="footer" id="contact">
      <div class="footer__panel container">
        <div class="footer__brand">
          <p class="footer__slogan">
            <span class="footer__line">Sip, Savor, Smile.</span>
            <em class="footer__accent">It's coffee time!</em>
          </p>
          <ul class="footer__social">
            <li>
              <a
                class="footer__social-link"
                href="https://twitter.com"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Twitter"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M19.5 7.2c-.6.3-1.2.4-1.9.5.7-.4 1.2-1 1.4-1.8-.6.4-1.3.7-2.1.8A3.2 3.2 0 0 0 12 9.3c0 .3 0 .5.1.7-2.7-.1-5-1.4-6.6-3.4-.3.5-.4 1-.4 1.6 0 1.1.6 2.1 1.5 2.7-.5 0-1-.2-1.5-.4 0 1.6 1.1 2.9 2.6 3.2-.3.1-.6.1-.9.1-.2 0-.4 0-.6-.1.4 1.3 1.6 2.2 3.1 2.3A6.5 6.5 0 0 1 5 16.6 9.1 9.1 0 0 0 10 18c5 0 7.7-4.1 7.7-7.7v-.4c.5-.4 1-.9 1.3-1.5-.5.2-1 .4-1.5.4z"
                  />
                </svg>
              </a>
            </li>
            <li>
              <a
                class="footer__social-link"
                href="https://instagram.com"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="4" y="4" width="16" height="16" rx="4" />
                  <circle cx="12" cy="12" r="3.5" />
                  <circle cx="17.2" cy="6.8" r="0.8" fill="currentColor" stroke="none" />
                </svg>
              </a>
            </li>
            <li>
              <a
                class="footer__social-link"
                href="https://facebook.com"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Facebook"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M14 9h2.5V6H14c-2.2 0-3.5 1.4-3.5 3.6V12H8v3h2.5v6H14v-6h2.2l.5-3H14V9.6c0-.4.2-.6.6-.6z"
                  />
                </svg>
              </a>
            </li>
          </ul>
          <ul class="footer__list">
            <li class="footer__item">
              <a
                class="footer__link"
                href="https://github.com/Bogagree"
                target="_blank"
                rel="noopener noreferrer"
                >GitHub</a
              >
            </li>
            <li class="footer__item">
              <a
                class="footer__link"
                href="https://rs.school/"
                target="_blank"
                rel="noopener noreferrer"
                >RS School</a
              >
            </li>
          </ul>
        </div>
        <div class="footer__contact">
          <p class="footer__title">Contact us</p>
          <address class="footer__contacts">
            <a
              class="footer__row"
              href="https://www.google.com/maps/search/?api=1&query=8558+Green+Rd.%2C+LA"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg class="footer__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z" />
                <circle cx="12" cy="10" r="2.2" />
              </svg>
              <span>8558 Green Rd., LA</span>
            </a>
            <a class="footer__row" href="tel:+16035550123">
              <svg class="footer__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M7 3.5h3.2l1.2 3.2-2 1.2a12 12 0 0 0 5.7 5.7l1.2-2 3.2 1.2V17a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 5 6.7 2 2 0 0 1 7 3.5z"
                />
              </svg>
              <span>+1 (603) 555-0123</span>
            </a>
            <span class="footer__row">
              <svg class="footer__icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8" />
                <path d="M12 8v4.5l3 2" />
              </svg>
              <span>Mon–Sat: 9:00–23:00</span>
            </span>
          </address>
        </div>
      </div>
    </footer>
    <script src="js/theme.js" defer></script>
    <script src="js/catalog.js" defer></script>
  </body>
</html>
