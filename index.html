<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee House</title>
    <!-- favicon: после появления файла в assets/ -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/themes.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner container">
        <a class="header__logo" href="index.html">Coffee House</a>
        <nav class="header__nav" aria-label="Main">
          <ul class="header__list">
            <li class="header__item">
              <a class="header__link" href="index.html#hero">Home</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="index.html#slider">Slider</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="index.html#about">About</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="index.html#extra">Extra</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="menu.html">Menu</a>
            </li>
          </ul>
        </nav>
        <div class="header__actions">
          <button class="header__theme" type="button">Theme</button>
          <button
            class="header__burger"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-disabled="true"
          >
            <span class="header__burger-bar" aria-hidden="true"></span>
            <span class="header__burger-bar" aria-hidden="true"></span>
            <span class="header__burger-bar" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>
    <main class="main container">
      <section class="hero" id="hero"></section>
      <section class="slider" id="slider"></section>
      <section class="section" id="about"></section>
      <section class="section" id="extra"></section>
    </main>
    <footer class="footer">
      <div class="footer__inner container">
        <p class="footer__copy">© 2026 Coffee House</p>
        <address class="footer__contacts">
          <a class="footer__link" href="tel:+375290000000">+375 29 000-00-00</a>
          <a
            class="footer__link"
            href="https://www.google.com/maps/search/?api=1&query=Minsk"
            target="_blank"
            rel="noopener noreferrer"
            >Minsk</a
          >
        </address>
        <ul class="footer__list">
          <li class="footer__item">
            <a
              class="footer__link"
              href="https://github.com/Bogagree"
              target="_blank"
              rel="noopener noreferrer"
              >GitHub</a
            >
          </li>
          <li class="footer__item">
            <a
              class="footer__link"
              href="https://rs.school/"
              target="_blank"
              rel="noopener noreferrer"
              >RS School</a
            >
          </li>
        </ul>
      </div>
    </footer>
    <script src="js/theme.js" defer></script>
  </body>
</html>
